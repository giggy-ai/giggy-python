name: Publish Python SDK (owner approval required)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed package version
        required: true
        type: string
      confirmation:
        description: Type publish giggy followed by the reviewed version
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify explicit publication confirmation
        env:
          APPROVED_VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert os.environ['APPROVED_VERSION'] == version, 'Version mismatch'
          assert os.environ['CONFIRMATION'] == f'publish giggy {version}', 'Explicit confirmation required'
          PY
      - run: python -m pip install build twine
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-python-distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
